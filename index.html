<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Nine</title>
    <link rel="icon" type="image/png" href="images/videonine.png">
    <meta name="description" content="Video editing for founders, creators, and startups. Long and short-form social media content.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Satoshi', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
                    },
                }
            }
        };
    </script>
</head>
<body class="bg-[#050505] text-[#e4e4e7] font-sans antialiased selection:bg-[#e4e4e7] selection:text-[#050505] min-h-screen flex flex-col">
    <main class="w-full max-w-3xl mx-auto lg:ml-[14%] xl:ml-[18%] lg:mr-auto px-6 pt-16 sm:pt-24 pb-16 flex-1">
        <div class="mb-6 sm:mb-8">
            <h1 class="text-[19px] sm:text-[20px] font-medium tracking-[-0.02em] text-[#e4e4e7]">Video Nine</h1>
        </div>

        <header class="space-y-5 text-[17px] sm:text-[18px] leading-[1.6] tracking-[-0.01em] text-[#a1a1aa] max-w-[600px]">
            <p>
                Video Nine is a video editing studio creating social media content for a handful of founders, creators, and startups at a time.
            </p>
            <p class="text-[#636369]">
                Get in touch at
                <a href="mailto:hello@videonine.co" class="text-[#e4e4e7] font-medium underline decoration-zinc-800 underline-offset-4 hover:decoration-[#e4e4e7] transition-colors">hello@videonine.co</a>
                <button type="button" onclick="copyEmail()" aria-label="Copy email address" title="Copy email address" class="inline-flex items-center align-middle ml-2 text-[#636369] hover:text-[#e4e4e7] transition-colors focus:outline-none">
                    <svg id="copy-icon" class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                    </svg>
                    <svg id="check-icon" class="w-3.5 h-3.5 hidden text-emerald-400" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                </button>
            </p>
        </header>

        <div id="portfolio" class="mt-12 md:mt-16 w-full aspect-[720/544] grid grid-cols-12 grid-rows-2 gap-[2.222%] select-none pointer-events-none">
            <div class="col-span-7 relative rounded-lg overflow-hidden bg-[#0d0d0e]">
                <video class="w-full h-full object-cover" src="videos/work-1-preview.mp4" autoplay loop muted playsinline></video>
            </div>
            <div class="col-span-5 relative rounded-lg overflow-hidden bg-[#0d0d0e]">
                <video class="w-full h-full object-cover" src="videos/work-2-preview.mp4" autoplay loop muted playsinline></video>
            </div>
            <div class="col-span-5 relative rounded-lg overflow-hidden bg-[#0d0d0e]">
                <video class="w-full h-full object-cover" src="videos/work-3-preview.mp4" autoplay loop muted playsinline></video>
            </div>
            <div class="col-span-7 relative rounded-lg overflow-hidden bg-[#0d0d0e]">
                <video class="w-full h-full object-cover" src="videos/work-4-preview.mp4" autoplay loop muted playsinline></video>
            </div>
        </div>

        <footer class="mt-12 md:mt-16 text-left">
            <p class="text-[13px] text-[#636369]">&copy; <span id="current-year"></span> Video Nine</p>
        </footer>
    </main>

    <script>
        let copyTimeout;

        function copyEmail() {
            const email = 'hello@videonine.co';
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(email).catch(() => fallbackCopy(email));
            } else {
                fallbackCopy(email);
            }

            const copyIcon = document.getElementById('copy-icon');
            const checkIcon = document.getElementById('check-icon');
            copyIcon.classList.add('hidden');
            checkIcon.classList.remove('hidden');

            clearTimeout(copyTimeout);
            copyTimeout = setTimeout(() => {
                copyIcon.classList.remove('hidden');
                checkIcon.classList.add('hidden');
            }, 2000);
        }

        function fallbackCopy(text) {
            const input = document.createElement('input');
            input.value = text;
            document.body.appendChild(input);
            input.select();
            document.execCommand('copy');
            document.body.removeChild(input);
        }

        document.getElementById('current-year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
